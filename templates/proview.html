<!DOCTYPE html>
<html>
    <head>
        <title>Project Details</title>
        <style>
            .web{
                display: grid;
                background-color: azure;
                margin-left: 150px;
                margin-top: 125px;
                padding:30px;
                grid-template-columns: 1fr 100px;
                border: 2px solid blue;
                border-radius: 12px;
            }
            h1{
                display: inline;
                font-family: sans-serif;
            }
            h3{
                display: inline-block;
                text-align: right;
            }
            p{
                font-family: sans-serif;
            }
            .title{
                font-family: sans-serif;
            }
            .prop{
                display:grid;
                height:20px;
                width:100px;
                padding:0;
                margin:0;
            }
        </style>
    </head>
    <body>
        <div class="web">
            {% for row in data %}
            <div class="content">
                <div>
                    <h1>Id:{{row[0]}}. </h1><h1 class="title">{{row[1]}}</h1>
                </div>
                <div>
                    <h2 style="font-family: sans-serif;">Description: {{row[5]}}</h2>
                </div>
                <div>
                    <p style="display: inline; padding-right: 20px;">Domain: {{row[3]}} </p><p>Dept: {{row[4]}}</p>
                </div>
                <div>
                    <p>Objective: {{row[2]}} </p>
                    <p>Outcome: {{row[6]}}</p>
                    <p>Citation: {{row[7]}} </p>
                </div>
                <div>
                    <p>Uploaded Files : </p>
                    <ul>
                        {% for file in files %}
                            <li>
                                <a href="{{ url_for('download', filename=file) }}">{{ file }}</a>
                            </li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
            <div class="prop">
                <h3 style="margin-right: 15px; margin-bottom: 5px;">{{row[9]}}</h3>
                <h3 style="margin-right: 15px; margin-top: 5px;">{{row[8]}}</h3>
            </div>
            {% endfor %}
        </div>
    </body>
</html>
